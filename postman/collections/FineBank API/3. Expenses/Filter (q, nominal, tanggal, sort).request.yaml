$kind: http-request
url: "{{baseUrl}}/api/expenses?q=nonton&minAmount=10000&from=2026-10-01&sort=-amount"
method: GET
queryParams:
  q: nonton
  minAmount: "10000"
  from: 2026-10-01
  sort: -amount
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
