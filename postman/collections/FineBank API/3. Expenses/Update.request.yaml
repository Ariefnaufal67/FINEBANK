$kind: http-request
url: "{{baseUrl}}/api/expenses/{{expenseId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "amount": 60000
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('amount berubah', () => pm.expect(pm.response.json().data.amount).to.eql(60000));
    language: text/javascript
order: 5000
