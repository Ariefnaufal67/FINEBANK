$kind: http-request
url: "{{baseUrl}}/api/bills/{{billId}}/pay"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('paid', () => pm.expect(pm.response.json().data.status).to.eql('paid'));
    language: text/javascript
order: 4000
