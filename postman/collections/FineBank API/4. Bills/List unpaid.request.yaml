$kind: http-request
url: "{{baseUrl}}/api/bills?status=unpaid&limit=10"
method: GET
queryParams:
  status: unpaid
  limit: "10"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
